name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 ships Xcode 16.4 (Swift 6.1) by default — the oldest toolchain we support.
        # macos-26 ships the current Xcode.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ matrix.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Release build
        run: swift build -c release

      - name: Smoke test CLI (no network)
        run: |
          .build/release/framer --help
          .build/release/framer list-devices
          .build/release/framer init --path "${RUNNER_TEMP}/framer.json"
          test -s "${RUNNER_TEMP}/framer.json"
